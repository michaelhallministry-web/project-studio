name: Optimize TrackLab chat icon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-chat-icon.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Resize and compress original chat icon
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          path = Path('media/chat-icon.webp')
          with Image.open(path) as source:
              im = ImageOps.exif_transpose(source)
              im.thumbnail((256, 256), Image.Resampling.LANCZOS)
              im.save(path, 'WEBP', quality=78, method=6)
          print(f'Optimized chat icon: {im.size}, {path.stat().st_size:,} bytes')
          PY
      - name: Commit optimized image if changed
        run: |
          if ! git diff --quiet -- media/chat-icon.webp; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add media/chat-icon.webp
            git commit -m "Optimize chat widget portrait WebP image"
            git push
          fi
